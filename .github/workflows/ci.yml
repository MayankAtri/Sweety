name: App checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sweety
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: sweety_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweety -d sweety_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_DATABASE_URL: postgres://sweety:ci_only_password@localhost:5432/sweety_test
      APP_TIMEZONE: Asia/Kolkata
      CLIENT_ORIGIN: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npm run build
        env:
          NODE_ENV: production

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: docker compose -p sweety-ci up -d --build --wait
      - run: docker compose -p sweety-ci exec -T api node server/scripts/seed.js
      - run: npm run test:docker
      - run: docker compose -p sweety-ci exec -T api node server/scripts/reminders.js enqueue
      - run: docker compose -p sweety-ci exec -T api node server/scripts/reminders.js enqueue
      - name: Container logs on failure
        if: failure()
        run: docker compose -p sweety-ci logs --no-color
      - name: Remove CI stack
        if: always()
        run: docker compose -p sweety-ci down -v
