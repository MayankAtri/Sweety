services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety_local_password
      POSTGRES_DB: sweety
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sweety_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sweety_postgres:
