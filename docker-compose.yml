# Local full-stack setup. The API uses development cookie settings because this
# Compose entrypoint is HTTP; the React assets are still an optimized build.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety_local_password
      POSTGRES_DB: sweety
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sweety_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://sweety:sweety_local_password@db:5432/sweety
      CLIENT_ORIGIN: http://localhost:8080
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    init: true

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sweety_postgres:
